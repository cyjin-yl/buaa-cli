[package]
name = "buaa-cli"
version = "0.1.1"
edition = "2024"
rust-version = "1.89"
description = "Agent-native BUAA tools with fail-closed account safety"
license = "MIT"

[dependencies]
fs2 = "0.4"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std"] }
encoding_rs = "=0.8.35"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
robotstxt = "0.3"
sha2 = "0.10"
url = "2.5"
hmac = "0.12"
icu_properties = "2.3.0"
md-5 = "0.10"
sha1 = "0.10"
openssl = "0.10"
zeroize = "1.9"
rusqlite = { version = "0.37", features = ["bundled", "hooks", "limits"] }
ego-tree = "0.10"
html5ever = "0.35"
scraper = "0.24"

[lib]
name = "buaa_cli"

[features]
# Temporary native-library proof only; remove both features and the example
# after RED/GREEN. RED enables the first feature, GREEN enables both.
directory-admission-proof = []
directory-admission-proof-candidate = ["directory-admission-proof"]
viewer-admission-proof = []

[[example]]
name = "directory_admission_proof"
required-features = ["directory-admission-proof"]

[[example]]
name = "viewer_admission_proof"
required-features = ["viewer-admission-proof"]

[[bin]]
name = "buaa"
path = "src/main.rs"
