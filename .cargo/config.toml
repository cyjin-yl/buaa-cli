# The public crates.io CDN does not answer from the build network, so the
# registry is replaced by a mainland mirror that answers quickly. The lock
# file still pins every crate checksum, so the mirror only changes where the
# identical crate bytes come from; it cannot change what is built.
#
# The replacement must be the canonical `crates-io` source. Cargo resolves a
# lock file against the source it names, so a differently named mirror leaves
# the lock file pointing at crates.io and the cached archives under that
# namespace unused.
#
# The replacement name matches the name the prebuilt job image uses, so both
# seats describe the same registry the same way. The cache directory is keyed
# on the registry URL rather than on this alias.
[source.crates-io]
replace-with = "rsproxy-sparse"

[source.rsproxy-sparse]
registry = "sparse+https://rsproxy.cn/index/"

# One compiler job keeps a build reproducible inside the shared build gate.
[build]
jobs = 1
