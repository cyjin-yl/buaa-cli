name: Admitted offline Rust

# No untrusted PR or branch event may execute on the shared build seat.
# An operator must admit both the workflow revision and the source SHA before
# dispatch. These variables are configuration, never credentials.
#
# This lane runs against the writable internal development repository. The
# read-only GitHub mirror cannot accept pushes and is not a development
# target.
on:
  workflow_dispatch:

jobs:
  offline:
    # Registered label portion; :host is an executor suffix, not a label.
    runs-on: vantage
    timeout-minutes: 30
    container:
      # Observed local vantage-ci-job image ID (it has no RepoDigests).
      # Runner must use this local image without pulling. Cache/tool coverage
      # and required mounts remain runtime admission prerequisites.
      image: sha256:57d4ae674d627b4d170c1e5c1a07e15971ab8f608a8c2f47307e7231c257fcab
      options: --user 1000:1000
    steps:
      - name: Check out the admitted immutable source
        shell: bash
        env:
          EXPECTED_SHA: ${{ vars.BUAA_CI_ADMITTED_SHA }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(id -u)" = 1000 ]]
          # The source is fetched with the installed operator credential
          # adapter, so the credential travels only through Git's own pipe:
          # nothing reaches argv, the environment, a receipt or a file in
          # this checkout, and the job never mounts the credential file.
          #
          # This lane therefore needs a Git client inside the job image. The
          # container network cannot reach the public action host, so an
          # action-based checkout is not available here.
          command -v git >/dev/null || {
            echo "the job image must provide a Git client" >&2
            exit 1
          }
          export GIT_TERMINAL_PROMPT=0
          export GITEA_PRIMARY_CONFIG=/etc/gitea-primary/config.json
          git init -q .
          git -c credential.helper=/opt/gitea-primary/git_credential.py \
            fetch --no-tags --depth=1 \
            http://10.10.10.12:3002/ezra/buaa-cli.git "$EXPECTED_SHA"
          [[ "$(git rev-parse --verify FETCH_HEAD)" = "$EXPECTED_SHA" ]]
          git -c advice.detachedHead=false checkout --detach --force "$EXPECTED_SHA"
          [[ "$(git rev-parse HEAD)" = "$EXPECTED_SHA" ]]

      - name: Confirm the admitted source is the checked-out source
        shell: bash
        env:
          EXPECTED_SHA: ${{ vars.BUAA_CI_ADMITTED_SHA }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(id -u)" = 1000 ]]
          [[ "$(git rev-parse HEAD)" = "$EXPECTED_SHA" ]]

      - name: Verify under the canonical shared gate without network
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(id -u)" = 1000 ]]
          # The runner must mount the real canonical OMP lock inode and the
          # UID1000 home/Cargo lock, not private copies of either path.
          test -x /home/ezra/.omp/agent/bin/agent-heavy
          test -f /home/ezra/.omp/agent/locks/heavy-work.lock
          test -f /home/ezra/.buaa-cli-cargo.lock
          isolated_home=$(mktemp -d)
          trap 'rm -rf -- "$isolated_home"' EXIT
          # Fresh, exclusive artifacts for this checkout; never a shared target.
          target=$(mktemp -d "$(pwd -P)/.ci-target.XXXXXXXX")
          trap 'rm -rf -- "$isolated_home" "$target"' EXIT
          # Dependency resolution is offline and the build never contacts a
          # registry. This is Cargo's own offline mode, not kernel-level
          # network isolation: the job image and the build environment must
          # still deny egress if a stronger boundary is required.
          /home/ezra/.omp/agent/bin/agent-heavy \
            env -i HOME="$isolated_home" \
              PATH=/usr/local/cargo/bin:/usr/local/bin:/usr/bin:/bin \
              CARGO_HOME=/usr/local/cargo RUSTUP_HOME=/usr/local/rustup \
              CARGO_NET_OFFLINE=true CARGO_BUILD_JOBS=1 \
              CMAKE_BUILD_PARALLEL_LEVEL=1 MAKEFLAGS=-j1 \
              CARGO_TARGET_DIR="$target" \
              bash --noprofile --norc -euo pipefail <<'OFFLINE'
          sh scripts/cargo-locked fmt --all -- --check
          sh scripts/cargo-locked build --locked --offline
          sh scripts/cargo-locked test --locked --offline
          sh scripts/cargo-locked clippy --all-targets --locked --offline -- -D warnings
          "$CARGO_TARGET_DIR/debug/buaa" --help
          "$CARGO_TARGET_DIR/debug/buaa" schema
          "$CARGO_TARGET_DIR/debug/buaa" capabilities
          OFFLINE
